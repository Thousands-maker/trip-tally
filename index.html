<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Tally — split travel costs offline</title>
<meta name="description" content="Share holiday expenses with your travel group. Works offline, multi-currency, receipt photos, and keeps everything on your own phone.">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="title">Trip Tally</h1>
  <span class="net" id="netBadge" title="Connection status"></span>
</header>

<main id="view" tabindex="-1"></main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  <span id="fabLabel">Add expense</span>
</button>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form method="dialog" id="sheetForm" novalidate></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<noscript><p style="padding:24px">Trip Tally needs JavaScript to run.</p></noscript>
<script src="app.js"></script>
</body>
</html>
